name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.3.0（需已存在或将由本次创建）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pkg and dmg
        run: ./macos/build.sh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netsplit-dist
          path: |
            macos/build/*.dmg
            macos/build/*.pkg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/build/*.dmg
            macos/build/*.pkg
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
